# 장면 명세서 — 영상 → 구현의 계약서
# 영상 분석 에이전트가 처음 쓰고, Unity 구현은 이 파일만 보고 만들고, 검수 결과도 여기에 적는다.
# 아래 값은 형식을 보여주는 예시예요. 실제 값은 spec 단계에서 채웁니다.

meta:
  title: 책상 위 꿈
  source_video: studio/nodes/reference-video/assets/final.mp4
  duration_s: 60          # 예시
  bpm: null               # BGM이 정해지면

desk:
  origin: front_edge_center   # 책상 앞 모서리 중앙
  axes: { x: right, y: up, z: into_desk }
  units: m
  size_m: [1.05, 0.50]        # IKEA MICKE
  height_m: 0.75
  surface_offset_mm: 0        # 캘리브레이션에서 런타임에 갱신
  calibration:
    fingertip_pad_offset_mm: 6   # 초기 추정치
    touch_enter_mm: 5
    touch_exit_mm: 12

objects:
  # 예시 한 개. 필드 형식만 참고
  - id: cd_player
    role: BGM 재생 장치, 투어 마지막 포인트
    pos_m: [0.30, 0.0, 0.22]
    size_m: [0.14, 0.05, 0.14]
    appear: { t_s: 41.0, beat: null, how: "구름 속에서 떠올라 착지" }
    idle: "디스크가 천천히 회전"
    ref_frames: ["final.mp4@00:41.2"]

timeline:
  # - { t_s: 0.0, beat: null, event: "책상 표면에 핑크 안개가 번짐" }
  []

interactions:
  # gesture: fingertip_tap | poke | pinch | palm_up | hover
  # - { target: cd_player, gesture: fingertip_tap, response: "BGM 트랙 변경", sfx: sfx/cd_click.wav }
  []

perf:
  # tag: ok | costly | impossible
  - { target: pink_clouds, tag: costly, fallback: "반투명 겹침 대신 불투명 메시 + 디더링, 개수 제한" }
  - { target: desk_lamp, tag: costly, fallback: "실시간 조명·그림자 대신 발광 재질 + 가짜 그림자" }

# ---------- 세 칸: 과업이 끝날 때 에이전트가 남긴다 (npm run studio -- done <id> --assume .. --compromise .. --unknown ..) ----------
# field 로 위의 칸을 가리키면 빈칸 지도에 표시된다. 예: objects.cd_player.pos_m, perf.pink_clouds

assumptions:
  # 말하지 않은 것을 어떻게 메웠는지. confidence: high | mid | low. 사람이 confirm 하거나 reject 한다
  # - { id: a1, task: spec, field: objects.cd_player.pos_m, text: "41초 프레임에서 책상 오른쪽 앞으로 읽음", confidence: low, status: open }
  []

compromises:
  # 조건(게이트)을 맞추려고 낮춘 것. 사람이 accept 하거나 과업을 다시 연다
  # - { id: c1, task: build, field: perf.pink_clouds, text: "구름 12개로 제한", gate: 72fps, status: open }
  []

unknowns:
  # 영상이나 디렉션만으로 정할 수 없는 것. 사람(또는 ask 에 적힌 과업)이 답한다
  # - { id: u1, task: spec, field: meta.bpm, question: "BGM이 정해졌나요?", ask: human, status: open }
  []

review:
  # 검수 때 헤드셋 녹화와 원본의 차이
  # - { t_s: 12.0, what: "물고기", diff: "영상보다 1.5배 빠름", fix: "swim_speed 0.6으로" }
  []
